version: 1
name: infrastructure-as-code
description: Reusable infrastructure architectures and Terraform capabilities.
consumers: [humans, codex, claude-code, nanami]

architectures:
  oci-single-vm-multi-app:
    provider: oci
    path: oci/reference-architectures/single-vm-multi-app
    implementation: oci/docker-platform
    status: stable
    purpose: Run multiple Docker applications on one OCI Compute platform.
    compute:
      shape: VM.Standard.A1.Flex
      architecture: arm64
      default_ocpus: 2
      default_memory_gb: 12
      default_boot_volume_gb: 50
      max_instances: 1
      terraform_inputs:
        shape: shape
        ocpus: ocpus
        memory_gb: memory_in_gbs
        boot_volume_gb: boot_volume_size_in_gbs
    constraint_profiles:
      - always-free
    compatible:
      - application-storage
      - registry
      - logging
      - observability
      - backup
      - vault

capabilities:
  application-storage:
    path: oci/application-storage
    kind: root-module
  registry:
    path: oci/modules/registry
    kind: module
  logging:
    path: oci/modules/logging
    kind: module
  observability:
    path: oci/modules/observability
    kind: module
  backup:
    path: oci/modules/backup
    kind: module
  vault:
    path: oci/modules/vault
    kind: module

constraint_profiles:
  always-free:
    provider: oci
    path: policies/oci/always-free.yaml

pricing_catalogs:
  oci:
    path: pricing/oci/current.yaml
    currency: USD
    mode: reviewed-static-list-price

foundations:
  platform-bootstrap:
    path: oci/platform-bootstrap
    owns: [compartment, terraform-state]
    state: local
  terraform-state:
    path: oci/terraform-state
    owns: [terraform-state]
    state: local

policies:
  never_commit: [terraform.tfvars, "*.tfstate", "*.tfstate.*", "*.tfbackend", credentials]
  plan_before_apply: true
  apply_requires_human_approval: true
  destroy_requires_human_approval: true
