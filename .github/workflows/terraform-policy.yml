name: Terraform Policy as Code

on:
  pull_request:
    paths:
      - ".github/policies/**"
      - ".github/workflows/terraform-policy.yml"
      - "oci/docker-platform/**"
      - "oci/modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment policy profile to validate
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

concurrency:
  group: terraform-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECKOV_VERSION: "3.3.8"
  POLICY_TARGET: oci/docker-platform
  POLICY_MODULES: oci/modules

jobs:
  policy:
    name: OCI Docker Platform - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","staging","prod"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Checkov
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "checkov==${CHECKOV_VERSION}"

      - name: Test local policies
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s .github/policies/tests \
            -p 'test_*.py' \
            -v
          python3 -m unittest discover \
            -s oci/docker-platform/deployment/tests \
            -p 'test_*.py' \
            -v

      - name: Run security and architecture policies
        run: |
          set -euo pipefail
          python3 .github/policies/run_policy_checks.py \
            --directory "$POLICY_TARGET" \
            --module-directory "$POLICY_MODULES" \
            --exceptions .github/policies/exceptions.json \
            --environment "${{ matrix.environment }}"
